#fishingScene{background:linear-gradient(165deg,#1d819c 0 100%)}#fishingScene:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(170deg,rgba(255,255,255,.08) 0 2px,transparent 2px 28px)}.deckIso{position:absolute;left:50%;top:48%;width:min(76vw,760px);height:min(68vw,530px);transform:translate(-50%,-50%) rotate(-20deg) skewX(8deg);border-radius:48% 46% 42% 44%;clip-path:polygon(50% 0,92% 22%,100% 73%,76% 100%,20% 100%,0 70%,8% 22%);background:linear-gradient(145deg,#f5f0e8 0 8%,#42474a 8% 85%,#d6d0c5 85% 100%);box-shadow:0 30px 35px rgba(0,0,0,.35),inset 0 0 0 6px rgba(255,255,255,.7)}.deckIso:before{content:"";position:absolute;inset:13% 10% 12%;clip-path:inherit;background:repeating-linear-gradient(90deg,#555b5e 0 45px,#474c4e 45px 47px);opacity:.9}.console{position:absolute;left:38%;top:18%;width:24%;height:20%;background:#161b1e;border:5px solid #cfd6d6;border-radius:14px;transform:rotate(-2deg);z-index:3}.console:after{content:"◉  ◉  ◉";position:absolute;inset:35% 8%;font-size:18px;color:#d7e7e8}.cooler{position:absolute;right:18%;top:34%;width:16%;height:13%;background:#d7dde0;border:4px solid #9fa8ad;border-radius:8px;z-index:3}.rods{position:absolute;right:9%;top:22%;width:3px;height:44%;background:#2b2418;box-shadow:12px 0 #2b2418,24px 0 #2b2418;z-index:4}.motor2{position:absolute;left:42%;bottom:-4%;width:18%;height:23%;background:linear-gradient(145deg,#2c3337,#080b0c);border-radius:20px;z-index:3}.player{position:absolute;left:50%;top:56%;width:44px;height:72px;transform:translate(-50%,-50%);z-index:8;filter:drop-shadow(0 8px 5px rgba(0,0,0,.35))}.head{position:absolute;left:13px;top:0;width:18px;height:18px;border-radius:50%;background:#d2a47d;box-shadow:0 -5px 0 -2px #1a3f70}.body{position:absolute;left:9px;top:17px;width:27px;height:32px;border-radius:9px;background:#164a7b}.leg{position:absolute;top:46px;width:10px;height:24px;background:#b59167;border-radius:5px}.leg.l{left:10px}.leg.r{right:9px}.shoe{position:absolute;top:66px;width:13px;height:7px;background:#15191b;border-radius:5px}.shoe.l{left:7px}.shoe.r{right:6px}.joy{position:absolute;left:25px;bottom:25px;width:150px;height:150px;border-radius:50%;border:4px solid rgba(255,255,255,.75);background:rgba(0,0,0,.18);z-index:15;touch-action:none}.stick{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(#fff,#ccd3d6);box-shadow:0 4px 10px rgba(0,0,0,.3)}#backBtn{position:absolute;left:22px;top:20px;z-index:16;background:rgba(7,25,31,.8);padding:13px 18px;border-radius:14px;border:1px solid #7fd8ff}.moveHint{position:absolute;right:20px;top:20px;z-index:16;background:rgba(7,25,31,.8);padding:12px 15px;border-radius:14px;max-width:230px}

.fishControls{position:absolute;right:24px;bottom:22px;z-index:18;width:170px;height:170px}.fishControls .fbtn{position:absolute;width:58px;height:58px;border-radius:14px;background:linear-gradient(#3d4a50,#172126);box-shadow:0 5px 0 #0b0f11,inset 0 0 0 2px rgba(255,255,255,.25);font-size:30px;font-weight:900}.fishControls .fbtn:active,.fishControls .fbtn.pressed{transform:translateY(3px);box-shadow:0 2px 0 #0b0f11}.fishControls .up{left:56px;top:0}.fishControls .down{left:56px;bottom:0}.fishControls .left{left:0;top:56px}.fishControls .right{right:0;top:56px}.fishLabel{position:absolute;right:26px;bottom:198px;z-index:18;background:rgba(7,25,31,.82);padding:8px 12px;border-radius:12px;font-weight:800}.rodLine{position:absolute;left:58%;top:46%;width:3px;height:180px;background:linear-gradient(#d8e2e5,#87989d);transform-origin:top center;z-index:9;pointer-events:none}.bobber{position:absolute;left:74%;top:64%;width:24px;height:24px;border-radius:50%;background:linear-gradient(#ff4b3e 0 50%,#f8f8f8 50%);border:2px solid #111;z-index:10;box-shadow:0 4px 8px rgba(0,0,0,.35)}#fishLayer{position:absolute;inset:0;z-index:6;pointer-events:none}.fishTarget{position:absolute;width:46px;height:24px;border-radius:60% 50% 50% 60%;background:#e0b43e;z-index:6;filter:drop-shadow(0 5px 4px rgba(0,0,0,.28));opacity:.9}.fishTarget:before{content:"";position:absolute;right:-13px;top:5px;border-left:15px solid #e0b43e;border-top:7px solid transparent;border-bottom:7px solid transparent}.catchHud{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:20;background:rgba(7,25,31,.82);padding:10px 15px;border-radius:14px;font-weight:900}.catchFlash{animation:catchPop .55s ease}@keyframes catchPop{0%{transform:translateX(-50%) scale(1)}45%{transform:translateX(-50%) scale(1.28)}100%{transform:translateX(-50%) scale(1)}}
@media(max-width:700px){#goal{min-width:0;width:215px}.ctrl{width:72px;height:64px}.controls{gap:10px}.zone{width:120px;height:70px}.speed{bottom:110px}.deckIso{width:88vw;height:68vw}.joy{width:125px;height:125px}.moveHint{top:auto;bottom:210px;right:12px;max-width:170px;font-size:13px}.fishControls{right:12px;bottom:18px;transform:scale(.9);transform-origin:bottom right}.fishLabel{right:14px;bottom:185px;font-size:12px}}

/* V1.8 – isometrisches Boot */
#boat{width:176px;height:108px;perspective:500px}
#boat .boatWrap{transform:rotateX(54deg) rotateZ(-45deg) skewY(0deg);transform-origin:50% 55%}
#boat .hull{inset:5px 4px 4px;border-radius:44% 56% 42% 48%/48% 46% 54% 52%;
background:linear-gradient(135deg,#fff 0 39%,#d9e1e3 40% 54%,#263840 55% 64%,#f3f3ef 65%);
clip-path:polygon(50% 0,96% 29%,100% 69%,74% 100%,20% 96%,0 65%,8% 24%)}
#boat .deck{left:22px;right:24px;top:18px;bottom:20px;background:linear-gradient(135deg,#d2ad78,#8d6945 60%,#42494c 61% 100%)}
#boat .glass{left:51px;top:31px;width:72px;height:25px}
#boat .seat.s1{left:57px}#boat .seat.s2{right:53px}
#boat .driver{left:78px;top:38px}
#boat .motor{left:73px;bottom:-13px;width:30px;height:35px}


/* V1.9 – realistisches isometrisches Offshore-Angelboot */
#boat{width:260px;height:180px;perspective:none;filter:drop-shadow(0 18px 13px rgba(0,0,0,.38))}
#boat .realBoat{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;
clip-path:polygon(3% 10%,97% 10%,97% 96%,3% 96%)}
#boat .wake{left:50%;top:78%;z-index:-1}
@media(max-width:700px){#boat{width:205px;height:142px}}


/* V2.0 – realistischere Wasseroberfläche */
#boatScene{
  background:
    radial-gradient(ellipse at 22% 28%,rgba(123,216,235,.18),transparent 28%),
    radial-gradient(ellipse at 75% 62%,rgba(2,45,73,.28),transparent 36%),
    linear-gradient(165deg,#1683a4 0%,#075b7d 48%,#064665 100%);
}
#boatScene:before{
  content:"";position:absolute;inset:-12%;opacity:.62;pointer-events:none;
  background:
    repeating-radial-gradient(ellipse at 20% 30%,rgba(255,255,255,.20) 0 1px,transparent 2px 17px),
    repeating-linear-gradient(168deg,transparent 0 16px,rgba(190,238,247,.13) 17px 19px,transparent 20px 39px);
  background-size:150px 62px,220px 78px;
  animation:waterDrift 7s linear infinite;
  filter:blur(.25px);
}
#boatScene:after{
  content:"";position:absolute;inset:-10%;pointer-events:none;opacity:.45;
  background:
    repeating-linear-gradient(12deg,transparent 0 28px,rgba(255,255,255,.18) 29px 31px,transparent 32px 66px),
    radial-gradient(ellipse at center,rgba(255,255,255,.10),transparent 62%);
  background-size:280px 96px,100% 100%;
  animation:waterCross 11s linear infinite;
  mix-blend-mode:screen;
}
@keyframes waterDrift{from{background-position:0 0,0 0}to{background-position:150px 62px,-220px 78px}}
@keyframes waterCross{from{background-position:0 0,0 0}to{background-position:-280px 96px,0 0}}
.waveFoam{position:absolute;inset:8% 0 0;z-index:2;pointer-events:none;overflow:hidden;opacity:.7}
.waveFoam i{position:absolute;width:110px;height:16px;border-top:2px solid rgba(235,250,255,.65);border-radius:50%;filter:blur(.2px);animation:crest 5.5s ease-in-out infinite}
.waveFoam i:nth-child(1){left:8%;top:23%;animation-delay:-1s}
.waveFoam i:nth-child(2){left:28%;top:48%;width:155px;animation-delay:-3.1s}
.waveFoam i:nth-child(3){left:61%;top:20%;width:135px;animation-delay:-2s}
.waveFoam i:nth-child(4){left:78%;top:67%;width:175px;animation-delay:-4.4s}
.waveFoam i:nth-child(5){left:45%;top:76%;width:95px;animation-delay:-.5s}
@keyframes crest{0%,100%{transform:translate(0,0) scaleX(.85);opacity:.18}50%{transform:translate(24px,7px) scaleX(1.15);opacity:.85}}
#boat{z-index:6}
#boat .wake{width:32px}
.moving .wake{
  opacity:.95;height:165px;
  background:
    linear-gradient(to bottom,rgba(255,255,255,.95),rgba(224,248,255,.55) 34%,rgba(255,255,255,0) 100%);
  clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
  filter:blur(2px) drop-shadow(0 0 5px rgba(255,255,255,.55));
}
@media (prefers-reduced-motion:reduce){
  #boatScene:before,#boatScene:after,.waveFoam i{animation:none}
}


/* V2.1 – fotorealistische Simulatoransicht nach Referenzbild */
#boatScene{
  background:#082f45 !important;
}
#boatScene:before,#boatScene:after,.waveFoam{display:none!important}
#boat{opacity:0;pointer-events:none}
#goal{background:rgba(4,16,23,.62);border-color:rgba(255,255,255,.35)}
.speed{background:rgba(4,16,23,.68)}
.controls{z-index:30}
#fishBtn{z-index:31}
#boatScene .version{z-index:32}


#boatScene{overflow:hidden;background:#082f45!important}
.simWorld{position:absolute;inset:-7%;z-index:0;overflow:hidden;transform-origin:center;will-change:transform}
.simOceanPhoto{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;will-change:transform}
.simWave{position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:screen;background:repeating-linear-gradient(170deg,transparent 0 22px,rgba(255,255,255,.20) 24px 26px,transparent 28px 58px);background-size:260px 94px;opacity:.28;filter:blur(.7px);animation:oceanMove 4.6s linear infinite}
.simWave.w2{opacity:.16;transform:rotate(8deg) scale(1.1);animation-duration:7.4s;animation-direction:reverse}
.simSpray{position:absolute;left:27%;bottom:4%;width:46%;height:27%;opacity:0;pointer-events:none;background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.9),rgba(218,245,255,.38) 38%,transparent 72%);filter:blur(5px);transition:opacity .2s}
#boatScene.movingSea .simSpray{opacity:.82}
@keyframes oceanMove{from{background-position:0 0}to{background-position:260px 94px}}
#boatScene:before,#boatScene:after,#boatScene .waveFoam{display:none!important}
#boat{display:none!important}
#boatScene>.hud,#boatScene>.controls,#boatScene>#fishBtn,#boatScene>.version,#boatScene>.speed{z-index:30}
@media(prefers-reduced-motion:reduce){.simWave{animation:none}}


/* V2.3: separates Boot, acht Fahrtrichtungen, bewegtes Wasser */
#boatScene{overflow:hidden;background:radial-gradient(ellipse at 78% 10%,rgba(255,234,187,.32),transparent 27%),linear-gradient(180deg,#79b2c8 0 17%,#176f91 18%,#074b6d 58%,#033653 100%)!important}
.simWorld,.simOceanPhoto,.simWave,.simSpray,#boatScene>.waveFoam{display:none!important}
.oceanWorld{position:absolute;inset:17% -18% -25%;z-index:1;overflow:hidden;perspective:720px}
.oceanTexture{position:absolute;inset:-42%;transform:rotateX(55deg) scale(1.55);transform-origin:center top;background:repeating-radial-gradient(ellipse at 22% 31%,rgba(239,252,255,.42) 0 1px,transparent 2px 19px),repeating-linear-gradient(169deg,transparent 0 17px,rgba(201,242,250,.28) 18px 21px,transparent 22px 48px),linear-gradient(155deg,#1683a4,#075a7a 52%,#033b5c);background-size:165px 66px,245px 90px,100% 100%;animation:oceanV23 5.4s linear infinite}
.oceanTexture:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(11deg,transparent 0 34px,rgba(255,255,255,.18) 35px 38px,transparent 39px 76px);background-size:315px 108px;animation:oceanCrossV23 8.2s linear infinite}
@keyframes oceanV23{to{background-position:165px 66px,-245px 90px,0 0}}@keyframes oceanCrossV23{to{background-position:-315px 108px}}
#boat{display:none!important}.playBoat{position:absolute;left:50%;top:57%;width:clamp(155px,19vw,285px);aspect-ratio:1;z-index:12;filter:drop-shadow(0 14px 9px rgba(0,0,0,.42));will-change:transform}.playBoat img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.boatWake{position:absolute;left:50%;top:62%;width:50px;height:0;z-index:10;transform:translateX(-50%);opacity:0;background:linear-gradient(to bottom,rgba(255,255,255,.95),rgba(218,246,255,.52) 38%,transparent);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);filter:blur(2px);transition:.15s}#boatScene.movingBoat .boatWake{height:205px;opacity:.9}
#boatScene>.hud,#boatScene>.controls,#boatScene>#fishBtn,#boatScene>.version,#boatScene>.speed{z-index:30}

</style>
</head>
<body>
<div id="app">
<section id="boatScene" class="scene active"><div class="oceanWorld" aria-hidden="true"><div class="oceanTexture" id="oceanTexture"></div></div><div class="boatWake"></div><div class="playBoat" id="playBoat"><img id="playBoatImg" src="boat_n.png?v=2.9.0" alt="Offshore-Angelboot"></div>
  <div class="simWorld" id="simWorld" aria-hidden="true">
    <img class="simOceanPhoto" id="simOceanPhoto" src="simulator_ocean_v22.jpg?v=2.2.0" alt="">
    <div class="simWave"></div><div class="simWave w2"></div><div class="simSpray"></div>
  </div>
  <div class="hud" style="left:50%;top:16px;transform:translateX(-50%);font-weight:800;letter-spacing:.08em">OFFSHORE SIMULATOR</div>
  <div class="waveFoam" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="goal" class="hud"><div class="label">FREIE FAHRT</div><strong>Fahr, wohin du möchtest</strong><div id="goalText">Zum Angeln anhalten.</div></div>
  <div class="hud version">V2.9</div>
  <div id="boat"><div class="wake"></div><img class="realBoat" src="offshore_boat_v20.png?v=2.0.0" alt="Isometrisches Offshore-Angelboot"></div>
  <div class="controls steer"><button id="leftBtn" class="ctrl">←</button><button id="rightBtn" class="ctrl">→</button></div>
  <div class="controls pedals"><button id="gasBtn" class="ctrl gas">G</button><button id="brakeBtn" class="ctrl brake">B</button></div>
  <div class="hud speed"><span id="speedValue">0</span> km/h</div>
  <button id="fishBtn" class="hidden">🎣 Hier angeln</button>
</section>
<section id="fishingScene" class="scene">
  <div class="hud version">V2.9</div>
  <div class="deckIso"><div class="console"></div><div class="cooler"></div><div class="rods"></div><div class="motor2"></div></div>
  <div id="player" class="player"><div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><div class="shoe l"></div><div class="shoe r"></div></div>
  <div id="joystick" class="joy"><div id="stick" class="stick"></div></div>
  <div id="rodLine" class="rodLine"></div><div id="bobber" class="bobber"></div><div id="fishLayer"></div>
  <div id="catchHud" class="catchHud">🎣 Fische: <span id="catchCount">0</span> · Neuer Fisch in <span id="fishCountdown">20</span>s</div>
  <div class="fishLabel">ANGEL STEUERN</div>
  <div class="fishControls" aria-label="Angelsteuerung">
    <button id="rodUp" class="fbtn up" aria-label="Angel hoch">▲</button>
    <button id="rodDown" class="fbtn down" aria-label="Angel runter">▼</button>
    <button id="rodLeft" class="fbtn left" aria-label="Angel links">◀</button>
    <button id="rodRight" class="fbtn right" aria-label="Angel rechts">▶</button>
  </div>
  <button id="backBtn">⛵ Zur Bootfahrt</button><div class="moveHint"><strong>BEWEGUNG</strong><br>Links: Mensch bewegen.<br>Rechts: Angel steuern.</div>
</section>
</div>
<script>
(()=>{'use strict';
const q=id=>document.getElementById(id),boatScene=q('boatScene'),fishingScene=q('fishingScene'),boat=q('boat'),speedValue=q('speedValue'),goalText=q('goalText'),fishBtn=q('fishBtn');const simWorld=q('simWorld'),simOceanPhoto=q('simOceanPhoto'),playBoat=q('playBoat'),playBoatImg=q('playBoatImg'),oceanTexture=q('oceanTexture');
const held={left:false,right:false,gas:false,brake:false},state={x:.38,y:.67,angle:20,speed:0};
const rodHeld={up:false,down:false,left:false,right:false},rodState={x:.74,y:.64};let catchCount=0;
function hold(el,key){const on=e=>{e.preventDefault();held[key]=true;el.classList.add('pressed');try{el.setPointerCapture(e.pointerId)}catch(_){}};const off=e=>{e.preventDefault();held[key]=false;el.classList.remove('pressed')};el.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,off));}
hold(q('leftBtn'),'left');hold(q('rightBtn'),'right');hold(q('gasBtn'),'gas');hold(q('brakeBtn'),'brake');
q('leftBtn').addEventListener('click',()=>{state.angle-=45;});
q('rightBtn').addEventListener('click',()=>{state.angle+=45;});
function rodHold(el,key){const on=e=>{e.preventDefault();rodHeld[key]=true;el.classList.add('pressed');try{el.setPointerCapture(e.pointerId)}catch(_){}};const off=e=>{e.preventDefault();rodHeld[key]=false;el.classList.remove('pressed')};el.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,off));}
rodHold(q('rodUp'),'up');rodHold(q('rodDown'),'down');rodHold(q('rodLeft'),'left');rodHold(q('rodRight'),'right');
const bobber=q('bobber'),rodLine=q('rodLine'),fishLayer=q('fishLayer'),catchHud=q('catchHud'),catchCountEl=q('catchCount'),fishCountdown=q('fishCountdown');
let fishes=[],nextFishAt=performance.now()+20000,fishId=0;
function spawnFish(){
  const fish={id:++fishId,x:.58+Math.random()*.32,y:.34+Math.random()*.42};
  const el=document.createElement('div');el.className='fishTarget';el.dataset.fishId=String(fish.id);
  el.style.left=(fish.x*100)+'%';el.style.top=(fish.y*100)+'%';

spawnFish();
function switchScene(fishing){boatScene.classList.toggle('active',!fishing);fishingScene.classList.toggle('active',fishing);Object.keys(held).forEach(k=>held[k]=false);Object.keys(rodHeld).forEach(k=>rodHeld[k]=false);if(fishing){nextFishAt=performance.now()+20000;fishCountdown.textContent='20'}}

const joystick=q('joystick'),stick=q('stick'),player=q('player'),joy={active:false,id:null,x:0,y:0},ps={x:.5,y:.56};
function setJoy(x,y){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy,max=r.width*.30,l=Math.hypot(dx,dy)||1;if(l>max){dx=dx/l*max;dy=dy/l*max}joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}
function resetJoy(){joy.active=false;joy.id=null;joy.x=joy.y=0;stick.style.transform='translate(-50%,-50%)'}

let last=performance.now();function loop(now){const dt=Math.min(.035,(now-last)/1000);last=now;if(boatScene.classList.contains('active')){if(held.gas)state.speed+=.30*dt;else state.speed-=.07*dt;if(held.brake)state.speed-=.65*dt;state.speed=Math.max(0,Math.min(.32,state.speed));const turn=(.35+state.speed*2.6)*dt;if(held.left)state.angle-=90*turn;if(held.right)state.angle+=90*turn;const r=state.angle*Math.PI/180;
const normAngle=((state.angle%360)+360)%360,dirNames=['n','ne','e','se','s','sw','w','nw'],dirName=dirNames[Math.round(normAngle/45)%8];
if(playBoatImg.dataset.dir!==dirName){playBoatImg.src=`boat_${dirName}.png?v=2.9.0`;playBoatImg.dataset.dir=dirName;}
const boatBob=Math.sin(now/420)*(1.4+state.speed*7),boatLean=(held.left?-4.5:0)+(held.right?4.5:0)+Math.sin(now/950)*.7;

const visualV=state.speed/.32,visualT=now/1000,steerVisual=(held.left?-1:0)+(held.right?1:0);
const bob=Math.sin(visualT*2.15)*(1.1+visualV*2.1),roll=Math.sin(visualT*1.28)*.25+steerVisual*1.1,travel=(visualT*state.speed*115)%220;
simOceanPhoto.style.transform=`translate3d(${Math.sin(r)*travel*.20}px,${travel*.08+bob}px,0) scale(${1.04+visualV*.045}) rotate(${roll*.10}deg)`;

boatScene.classList.toggle('movingSea',state.speed>.03);
const stopped=state.speed<.025;if(stopped){goalText.textContent='Hier kannst du angeln.';fishBtn.classList.remove('hidden')}else{goalText.textContent='Fahr, wohin du möchtest. Zum Angeln anhalten.';fishBtn.classList.add('hidden')}}
if(fishingScene.classList.contains('active')){const m=Math.hypot(joy.x,joy.y);if(m>.08){ps.x+=joy.x*.17*dt;ps.y+=joy.y*.17*dt;ps.x=Math.max(.34,Math.min(.66,ps.x));ps.y=Math.max(.33,Math.min(.72,ps.y));player.style.left=ps.x*100+'%';player.style.top=ps.y*100+'%';player.style.transform=`translate(-50%,-50%) rotate(${joy.x*6}deg)`}
const rs=.22*dt;if(rodHeld.up)rodState.y-=rs;if(rodHeld.down)rodState.y+=rs;if(rodHeld.left)rodState.x-=rs;if(rodHeld.right)rodState.x+=rs;rodState.x=Math.max(.56,Math.min(.92,rodState.x));rodState.y=Math.max(.30,Math.min(.82,rodState.y));bobber.style.left=(rodState.x*100)+'%';bobber.style.top=(rodState.y*100)+'%';const anchorX=.58,anchorY=.46,dx=(rodState.x-anchorX)*innerWidth,dy=(rodState.y-anchorY)*innerHeight,len=Math.hypot(dx,dy),ang=Math.atan2(dx,dy)*180/Math.PI;rodLine.style.height=Math.max(30,len)+'px';rodLine.style.transform=`rotate(${-ang}deg)`;

for(let i=fishes.length-1;i>=0;i--){const f=fishes[i];if(Math.hypot(rodState.x-f.x,rodState.y-f.y)<.045){catchCount++;catchCountEl.textContent=catchCount;catchHud.classList.remove('catchFlash');void catchHud.offsetWidth;catchHud.classList.add('catchFlash');f.el.remove();fishes.splice(i,1);}}}requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
