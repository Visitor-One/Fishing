<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0b5680" />
  <title>Angelspiel V1.1</title>
  <link rel="stylesheet" href="style.css?v=1.1.0-20260828" />
</head>
<body>
  <div id="app">
    <div id="versionBadge">Angelspiel V1.1</div>

    <section id="boatScene" class="scene active" aria-label="Boot fahren">
      <div class="skyGlow"></div>
      <div class="shore shoreLeft"></div>
      <div class="shore shoreRight"></div>
      <div class="island island1"></div>
      <div class="island island2"></div>
      <div class="buoy buoy1"><span></span></div>
      <div class="buoy buoy2"><span></span></div>
      <div class="fishingZone" id="fishingZone">
        <div class="ring"></div>
        <div class="zoneLabel">Angelplatz</div>
      </div>
      <div class="waterShimmer s1"></div>
      <div class="waterShimmer s2"></div>
      <div class="waterShimmer s3"></div>

      <div id="boat" class="boat" aria-label="Boot">
        <div class="wake wakeLeft"></div>
        <div class="wake wakeRight"></div>
        <div class="boatShadow"></div>
        <div class="hull"><div class="hullStripe"></div></div>
        <div class="deck">
          <div class="bowCushion"></div>
          <div class="cockpitWell"></div>
          <div class="rearBench"></div>
        </div>
        <div class="windshield"><span></span><span></span></div>
        <div class="console"><i></i></div>
        <div class="seat seatLeft"></div>
        <div class="seat seatRight"></div>
        <div class="rail railBoatLeft"></div>
        <div class="rail railBoatRight"></div>
        <div class="motor"><div class="motorCap"></div></div>
      </div>

      <div class="hud topHud">
        <div><b>Geschwindigkeit</b><span id="speedValue">0</span></div>
        <div><b>Ziel</b><span id="goalText">Zum Angelplatz fahren</span></div>
      </div>

      <div class="steering controlsPanel">
        <button id="leftBtn" class="roundControl" aria-label="Links">◀</button>
        <button id="rightBtn" class="roundControl" aria-label="Rechts">▶</button>
      </div>

      <div class="pedals controlsPanel">
        <button id="gasBtn" class="pedal gas" aria-label="Gas"><span>G</span><small>GAS</small></button>
        <button id="brakeBtn" class="pedal brake" aria-label="Bremse"><span>B</span><small>BREMSE</small></button>
      </div>

      <button id="fishBtn" class="fishButton hidden">Angeln</button>
    </section>

    <section id="fishingScene" class="scene" aria-label="Auf dem Boot">
      <div class="deckScene">
        <div class="waterAround"></div>
        <div class="bigBoatDeck">
          <div class="rail railTop"></div>
          <div class="rail railBottom"></div>
          <div class="rail railLeft"></div>
          <div class="rail railRight"></div>
          <div class="cabinBlock"><div class="cabinGlass"></div></div>
          <div class="bench benchA"></div>
          <div class="bench benchB"></div>
          <div class="rodRack"><span></span><span></span><span></span></div>
          <div id="player" class="player">
            <div class="playerShadow"></div>
            <div class="leg legL"></div>
            <div class="leg legR"></div>
            <div class="shoe shoeL"></div>
            <div class="shoe shoeR"></div>
            <div class="body"></div>
            <div class="arm armL"></div>
            <div class="arm armR"></div>
            <div class="head"></div>
            <div class="cap"></div>
          </div>
        </div>
      </div>

      <div class="hud fishingHud">
        <div><b>Auf dem Boot</b><span>Bewege die Figur mit dem Joystick</span></div>
      </div>

      <div id="joystick" class="joystick" aria-label="Joystick">
        <div id="stick" class="stick"></div>
      </div>

      <button id="backBtn" class="backButton">← Zurück zum Fahren</button>
    </section>
  </div>

  <script src="game.js?v=1.1.0-20260828"></script>
</body>
</html>
