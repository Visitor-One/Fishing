/* V2.0 – realistischere Wasseroberfläche */
#boatScene{
  background:
    radial-gradient(ellipse at 22% 28%,rgba(123,216,235,.18),transparent 28%),
    radial-gradient(ellipse at 75% 62%,rgba(2,45,73,.28),transparent 36%),
    linear-gradient(165deg,#1683a4 0%,#075b7d 48%,#064665 100%);
}
#boatScene:before{
  content:"";position:absolute;inset:-12%;opacity:.62;pointer-events:none;
  background:
    repeating-radial-gradient(ellipse at 20% 30%,rgba(255,255,255,.20) 0 1px,transparent 2px 17px),
    repeating-linear-gradient(168deg,transparent 0 16px,rgba(190,238,247,.13) 17px 19px,transparent 20px 39px);
  background-size:150px 62px,220px 78px;
  animation:waterDrift 7s linear infinite;
  filter:blur(.25px);
}
#boatScene:after{
  content:"";position:absolute;inset:-10%;pointer-events:none;opacity:.45;
  background:
    repeating-linear-gradient(12deg,transparent 0 28px,rgba(255,255,255,.18) 29px 31px,transparent 32px 66px),
    radial-gradient(ellipse at center,rgba(255,255,255,.10),transparent 62%);
  background-size:280px 96px,100% 100%;
  animation:waterCross 11s linear infinite;
  mix-blend-mode:screen;
}
@keyframes waterDrift{from{background-position:0 0,0 0}to{background-position:150px 62px,-220px 78px}}
@keyframes waterCross{from{background-position:0 0,0 0}to{background-position:-280px 96px,0 0}}
.waveFoam{position:absolute;inset:8% 0 0;z-index:2;pointer-events:none;overflow:hidden;opacity:.7}
.waveFoam i{position:absolute;width:110px;height:16px;border-top:2px solid rgba(235,250,255,.65);border-radius:50%;filter:blur(.2px);animation:crest 5.5s ease-in-out infinite}
.waveFoam i:nth-child(1){left:8%;top:23%;animation-delay:-1s}
.waveFoam i:nth-child(2){left:28%;top:48%;width:155px;animation-delay:-3.1s}
.waveFoam i:nth-child(3){left:61%;top:20%;width:135px;animation-delay:-2s}
.waveFoam i:nth-child(4){left:78%;top:67%;width:175px;animation-delay:-4.4s}
.waveFoam i:nth-child(5){left:45%;top:76%;width:95px;animation-delay:-.5s}
@keyframes crest{0%,100%{transform:translate(0,0) scaleX(.85);opacity:.18}50%{transform:translate(24px,7px) scaleX(1.15);opacity:.85}}
#boat{z-index:6}
#boat .wake{width:32px}
.moving .wake{
  opacity:.95;height:165px;
  background:
    linear-gradient(to bottom,rgba(255,255,255,.95),rgba(224,248,255,.55) 34%,rgba(255,255,255,0) 100%);
  clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
  filter:blur(2px) drop-shadow(0 0 5px rgba(255,255,255,.55));
}
@media (prefers-reduced-motion:reduce){
  #boatScene:before,#boatScene:after,.waveFoam i{animation:none}
}

  background:#082f45 !important;
}

.speed{background:rgba(4,16,23,.68)}
.controls{z-index:30}

#boatScene{overflow:hidden;background:#082f45!important}
.simWorld{position:absolute;inset:-7%;z-index:0;overflow:hidden;transform-origin:center;will-change:transform}

#boat{display:none!important}.playBoat{position:absolute;left:50%;top:57%;width:clamp(155px,19vw,285px);aspect-ratio:1;z-index:12;filter:drop-shadow(0 14px 9px rgba(0,0,0,.42));will-change:transform}.playBoat img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}

/* V3.1 – animierte realistischere Meeresoberfläche */
.oceanWorld{position:absolute!important;inset:16% -12% -20%!important;overflow:hidden!important;perspective:850px!important;background:linear-gradient(180deg,#18799a,#075b7b 45%,#033e5d)!important}
.oceanTexture{position:absolute!important;inset:-35%!important;transform:rotateX(56deg) scale(1.6)!important;transform-origin:center top!important;background:radial-gradient(ellipse at 30% 40%,rgba(255,255,255,.30) 0 1px,transparent 2px 24px),repeating-linear-gradient(166deg,transparent 0 22px,rgba(218,249,255,.38) 24px 27px,transparent 29px 58px),repeating-linear-gradient(14deg,transparent 0 39px,rgba(115,204,226,.28) 41px 44px,transparent 46px 86px),linear-gradient(155deg,#1883a5,#075675 55%,#033a58)!important;background-size:190px 78px,300px 112px,380px 145px,100% 100%!important;animation:seaPrimary 4.8s linear infinite!important;filter:saturate(1.18) contrast(1.08)!important}

.waveA{
 background:repeating-radial-gradient(ellipse 150px 34px at 50% 50%,transparent 0 60%,rgba(232,250,255,.72) 62% 64%,rgba(255,255,255,.18) 66%,transparent 69% 100%);
 background-size:300px 105px;opacity:.72;filter:blur(.25px);
 animation:waveDriftA 4.2s linear infinite;

 background:repeating-radial-gradient(ellipse 115px 26px at 50% 50%,transparent 0 61%,rgba(177,229,242,.55) 63% 66%,transparent 69% 100%);
 background-size:245px 82px;opacity:.65;
 animation:waveDriftB 6.4s linear infinite;

 background:repeating-linear-gradient(168deg,transparent 0 48px,rgba(255,255,255,.34) 50px 52px,transparent 54px 112px);

.oceanWorld{
  background:linear-gradient(180deg,#147493 0%,#075574 48%,#033d5c 100%)!important;
}

  inset:-28%!important;

    repeating-radial-gradient(ellipse 210px 38px at 50% 50%,

 filter:blur(.35px);will-change:transform}
.swellFar{top:20%;transform:scale(.72);animation:swellFar 7.6s ease-in-out infinite}
.swellNear{top:55%;height:36%;opacity:.62;animation:swellNear 6.2s ease-in-out infinite}
.sunGlint{position:absolute;z-index:3;pointer-events:none;right:-4%;top:2%;width:42%;height:78%;
 background:radial-gradient(ellipse at 72% 15%,rgba(255,247,211,.28),rgba(255,255,255,.09) 28%,transparent 67%);
 animation:glint 5.8s ease-in-out infinite}
@keyframes oceanSwellBase{0%{background-position:0 0,0 0}100%{background-position:420px 128px,0 0}}
@keyframes swellFar{0%,100%{transform:translate3d(-2%,0,0) scale(.72,.88)}50%{transform:translate3d(2%,12px,0) scale(.74,1.03)}}
@keyframes swellNear{0%,100%{transform:translate3d(1%,10px,0) scale(1,1)}50%{transform:translate3d(-2%,-10px,0) scale(1.02,1.08)}}
@keyframes glint{0%,100%{opacity:.55;transform:translateX(0)}50%{opacity:.82;transform:translateX(-2%)}}
#boatScene.movingBoat .oceanTexture{animation-duration:6.4s!important}
#boatScene.movingBoat .swellFar{animation-duration:6.1s}
#boatScene.movingBoat .swellNear{animation-duration:4.9s}


/* V3.4 – echtes WebGL-Meer mit animierter Gerstner-artiger Geometrie */
.oceanWorld,.oceanTexture,.swell,.sunGlint,.waveLayer{display:none!important}
#webglOcean{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block;background:linear-gradient(#75b9d0 0 17%,#0b5d7e 17% 100%)}

.playBoat{z-index:12!important}.boatWake{z-index:10!important}

#webglOcean{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;background:linear-gradient(#78bdd4 0 16%,#4ea0bf 16% 22%,#0b5475 22% 100%)}
.horizonGlow{position:absolute;left:0;right:0;top:12%;height:12%;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0));pointer-events:none;z-index:2}
#boatScene:before{display:none!important}.hud,.controls,#fishBtn{z-index:20}.speed{z-index:21}

<script>

(()=>{'use strict';
const q=id=>document.getElementById(id);
const boatScene=q('boatScene'), fishingScene=q('fishingScene');
const speedValue=q('speedValue'), goalText=q('goalText'), fishBtn=q('fishBtn');
const leftBtn=q('leftBtn'), rightBtn=q('rightBtn'), gasBtn=q('gasBtn'), brakeBtn=q('brakeBtn');
const held={left:false,right:false,gas:false,brake:false};
const boatState={x:0,z:8,yaw:0,speed:0};
function hold(el,key){const on=e=>{e.preventDefault();held[key]=true;el.classList.add('pressed');try{el.setPointerCapture(e.pointerId)}catch(_){}};const off=e=>{e.preventDefault();held[key]=false;el.classList.remove('pressed')};el.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,off));}
hold(leftBtn,'left');hold(rightBtn,'right');hold(gasBtn,'gas');hold(brakeBtn,'brake');
leftBtn.addEventListener('click',()=>{boatState.yaw-=0.12}); rightBtn.addEventListener('click',()=>{boatState.yaw+=0.12});

const rodHeld={up:false,down:false,left:false,right:false},rodState={x:.74,y:.64};let catchCount=0;
function rodHold(el,key){const on=e=>{e.preventDefault();rodHeld[key]=true;el.classList.add('pressed');try{el.setPointerCapture(e.pointerId)}catch(_){}};const off=e=>{e.preventDefault();rodHeld[key]=false;el.classList.remove('pressed')};el.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,off));}
rodHold(q('rodUp'),'up');rodHold(q('rodDown'),'down');rodHold(q('rodLeft'),'left');rodHold(q('rodRight'),'right');
const bobber=q('bobber'),rodLine=q('rodLine'),fishLayer=q('fishLayer'),catchHud=q('catchHud'),catchCountEl=q('catchCount'),fishCountdown=q('fishCountdown');
let fishes=[],nextFishAt=performance.now()+20000,fishId=0;
function spawnFish(){const fish={id:++fishId,x:.58+Math.random()*.32,y:.34+Math.random()*.42};const el=document.createElement('div');el.className='fishTarget';el.dataset.fishId=String(fish.id);el.style.left=(fish.x*100)+'%';el.style.top=(fish.y*100)+'%';if(Math.random()>.5)el.style.transform='scaleX(-1)';fish.el=el;fishLayer.appendChild(el);fishes.push(fish);}
spawnFish();
function switchScene(fishing){boatScene.classList.toggle('active',!fishing);fishingScene.classList.toggle('active',fishing);Object.keys(held).forEach(k=>held[k]=false);Object.keys(rodHeld).forEach(k=>rodHeld[k]=false);if(fishing){nextFishAt=performance.now()+20000;fishCountdown.textContent='20';} else {catchHud.classList.remove('catchFlash');}}
fishBtn.addEventListener('click',()=>switchScene(true)); q('backBtn').addEventListener('click',()=>switchScene(false));
const joystick=q('joystick'),stick=q('stick'),player=q('player'),joy={active:false,id:null,x:0,y:0},ps={x:.5,y:.56};
function setJoy(x,y){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy,max=r.width*.30,l=Math.hypot(dx,dy)||1;if(l>max){dx=dx/l*max;dy=dy/l*max}joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;}
function resetJoy(){joy.active=false;joy.id=null;joy.x=joy.y=0;stick.style.transform='translate(-50%,-50%)';}
joystick.addEventListener('pointerdown',e=>{e.preventDefault();joy.active=true;joy.id=e.pointerId;try{joystick.setPointerCapture(e.pointerId)}catch(_){}setJoy(e.clientX,e.clientY)});joystick.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.id)setJoy(e.clientX,e.clientY)});joystick.addEventListener('pointerup',resetJoy);joystick.addEventListener('pointercancel',resetJoy);

// ===== Minimal WebGL engine =====
const canvas=q('webglOcean');
const gl=canvas.getContext('webgl',{alpha:false,antialias:true,depth:true,preserveDrawingBuffer:false});
let ready=false,prog,loc={},ocean,boat;
const waves=[
  {a:.45, dx:.96, dz:.28, k:.32, s:1.05, p:0.2},
  {a:.28, dx:.34, dz:.94, k:.45, s:1.32, p:1.7},
  {a:.14, dx:-.82, dz:.57, k:.78, s:1.95, p:2.6},
  {a:.08, dx:.62, dz:-.78, k:1.18, s:2.45, p:0.9},
];
function waveSample(x,z,t){let y=0,dx=0,dz=0,ox=x,oz=z;for(const w of waves){const ph=(x*w.dx+z*w.dz)*w.k-t*w.s+w.p;y+=Math.sin(ph)*w.a;const c=Math.cos(ph)*w.a*w.k;dx+=w.dx*c;dz+=w.dz*c;ox+=w.dx*Math.cos(ph)*w.a*.18;oz+=w.dz*Math.cos(ph)*w.a*.18;}return {y,dx,dz,ox,oz};}
function createProgram(vsSrc,fsSrc){function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o}const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vsSrc));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fsSrc));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;}
function m4mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[0*4+r]*b[c*4+0]+a[1*4+r]*b[c*4+1]+a[2*4+r]*b[c*4+2]+a[3*4+r]*b[c*4+3];return o;}
function m4persp(fovy,asp,n,f){const t=1/Math.tan(fovy/2),o=new Float32Array(16);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;}
function v3sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]} function v3cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]} function v3norm(v){const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l]}
function m4look(eye,target,up){const z=v3norm(v3sub(eye,target)),x=v3norm(v3cross(up,z)),y=v3cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]),-(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),-(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]),1]);}
function m4identity(){const o=new Float32Array(16);o[0]=o[5]=o[10]=o[15]=1;return o}
function m4translate(x,y,z){const o=m4identity();o[12]=x;o[13]=y;o[14]=z;return o}
function m4rotX(a){const c=Math.cos(a),s=Math.sin(a),o=m4identity();o[5]=c;o[6]=s;o[9]=-s;o[10]=c;return o}
function m4rotY(a){const c=Math.cos(a),s=Math.sin(a),o=m4identity();o[0]=c;o[2]=-s;o[8]=s;o[10]=c;return o}
function m4rotZ(a){const c=Math.cos(a),s=Math.sin(a),o=m4identity();o[0]=c;o[1]=s;o[4]=-s;o[5]=c;return o}
function m4scale(x,y,z){const o=m4identity();o[0]=x;o[5]=y;o[10]=z;return o}
function makeMesh(data, dynamic){const inter=new Float32Array(data);const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,inter,dynamic?gl.DYNAMIC_DRAW:gl.STATIC_DRAW);return {vb,count:inter.length/9,data:inter,dynamic};}
function push(arr,p,n,c){arr.push(p[0],p[1],p[2],n[0],n[1],n[2],c[0],c[1],c[2]);}
function quad(arr,a,b,c,d,col){const n=v3norm(v3cross(v3sub(b,a),v3sub(c,a)));push(arr,a,n,col);push(arr,b,n,col);push(arr,c,n,col);push(arr,a,n,col);push(arr,c,n,col);push(arr,d,n,col);} 
function addBox(arr,cx,cy,cz,sx,sy,sz,col){const x=sx/2,y=sy/2,z=sz/2;const p=[[cx-x,cy-y,cz-z],[cx+x,cy-y,cz-z],[cx+x,cy+y,cz-z],[cx-x,cy+y,cz-z],[cx-x,cy-y,cz+z],[cx+x,cy-y,cz+z],[cx+x,cy+y,cz+z],[cx-x,cy+y,cz+z]];quad(arr,p[4],p[5],p[6],p[7],col);quad(arr,p[1],p[0],p[3],p[2],col);quad(arr,p[0],p[4],p[7],p[3],col);quad(arr,p[5],p[1],p[2],p[6],col);quad(arr,p[3],p[7],p[6],p[2],col);quad(arr,p[0],p[1],p[5],p[4],col);} 
function buildBoat(){const a=[];const navy=[0.05,0.13,0.26],white=[0.96,0.97,0.98],deck=[0.86,0.83,0.78],glass=[0.28,0.45,0.58],metal=[0.72,0.75,0.77];
 addBox(a,0,0.35,0.15,2.05,0.72,4.1,navy); addBox(a,0,0.47,-1.82,1.15,0.58,1.55,navy); addBox(a,0,0.82,-0.18,1.78,0.13,3.82,white); addBox(a,0,0.9,-0.05,1.34,0.05,3.0,deck);
 addBox(a,0,1.22,-0.35,1.18,0.62,1.72,white); addBox(a,0,1.36,-0.44,1.03,0.28,0.44,glass); addBox(a,0,1.55,-0.33,0.88,0.10,1.18,white); addBox(a,0,1.9,-0.33,1.02,0.08,1.02,white);
 const posts=[[-0.38,1.73,0.02], [0.38,1.73,0.02],[-0.38,1.73,-0.68],[0.38,1.73,-0.68]]; for(const p of posts)addBox(a,p[0],p[1],p[2],0.06,0.70,0.06,metal);
 addBox(a,0,2.18,-0.33,0.22,0.42,0.22,white); addBox(a,0,2.5,-0.33,0.03,0.60,0.03,metal); addBox(a,-0.02,2.12,-0.33,0.54,0.04,0.54,metal);
 for(const sx of [-.75,-.55,.55,.75]) addBox(a,sx,1.18,1.18,0.03,1.0,0.03,metal);
 for(const sx of [-.72,-.54,.54,.72]) addBox(a,sx,1.7,1.42,0.02,1.5,0.02,[0.15,0.13,0.11]);
 return makeMesh(a,false);
 }
 function buildOcean(nx,nz,w,d){const data=new Float32Array((nx+1)*(nz+1)*9);const base=[];let ptr=0;for(let iz=0;iz<=nz;iz++){for(let ix=0;ix<=nx;ix++){const x=(ix/nx-.5)*w,z=(iz/nz)*d-8;base.push(x,z);data[ptr]=x;data[ptr+1]=0;data[ptr+2]=z;data[ptr+3]=0;data[ptr+4]=1;data[ptr+5]=0;data[ptr+6]=0.03;data[ptr+7]=0.34;data[ptr+8]=0.48;ptr+=9;}}const idx=[];for(let iz=0;iz<nz;iz++)for(let ix=0;ix<nx;ix++){const a=iz*(nx+1)+ix,b=a+1,c=a+nx+1,dv=c+1;idx.push(a,c,b,b,c,dv)}const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,data,gl.DYNAMIC_DRAW);const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);return {vb,ib,count:idx.length,data,base,nx,nz}; }
 function init3D(){if(!gl)return; const vs=`attribute vec3 aPos; attribute vec3 aNor; attribute vec3 aCol; uniform mat4 uMVP; uniform mat4 uModel; uniform float uWater; varying vec3 vCol; varying vec3 vNor; varying float vWater; varying float vY; void main(){ vec4 wp=uModel*vec4(aPos,1.0); vNor=normalize((uModel*vec4(aNor,0.0)).xyz); vCol=aCol; vWater=uWater; vY=wp.y; gl_Position=uMVP*vec4(aPos,1.0);} `;
 const fs=`precision mediump float; varying vec3 vCol; varying vec3 vNor; varying float vWater; varying float vY; void main(){ vec3 n=normalize(vNor); vec3 l=normalize(vec3(0.35,0.95,0.22)); float diff=max(dot(n,l),0.0); float spec=pow(max(dot(reflect(-l,n),normalize(vec3(0.0,0.85,0.55))),0.0),18.0); vec3 col=vCol; if(vWater>0.5){ float crest=smoothstep(0.18,0.55,vY); col=mix(vec3(0.02,0.21,0.31),vec3(0.03,0.42,0.58),0.45+vY*0.28); col+=crest*vec3(0.18,0.24,0.25);} vec3 lit=col*(0.38+diff*0.82)+spec*(vWater>0.5?0.20:0.08); gl_FragColor=vec4(lit,1.0);} `;
 prog=createProgram(vs,fs); gl.useProgram(prog); loc.pos=gl.getAttribLocation(prog,'aPos'); loc.nor=gl.getAttribLocation(prog,'aNor'); loc.col=gl.getAttribLocation(prog,'aCol'); loc.mvp=gl.getUniformLocation(prog,'uMVP'); loc.model=gl.getUniformLocation(prog,'uModel'); loc.water=gl.getUniformLocation(prog,'uWater');
 boat=buildBoat(); ocean=buildOcean(84,92,52,78); gl.enable(gl.DEPTH_TEST); ready=true; }
 function bindMesh(mesh,indexed){gl.bindBuffer(gl.ARRAY_BUFFER,mesh.vb);gl.enableVertexAttribArray(loc.pos);gl.vertexAttribPointer(loc.pos,3,gl.FLOAT,false,36,0);gl.enableVertexAttribArray(loc.nor);gl.vertexAttribPointer(loc.nor,3,gl.FLOAT,false,36,12);gl.enableVertexAttribArray(loc.col);gl.vertexAttribPointer(loc.col,3,gl.FLOAT,false,36,24); if(indexed)gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,mesh.ib);} 
 function updateOcean(t){const d=ocean.data,b=ocean.base;let ptr=0;for(let i=0;i<b.length;i+=2){const s=waveSample(b[i],b[i+1],t);const nx=-s.dx, nz=-s.dz, inv=1/Math.hypot(nx,1,nz);d[ptr]=s.ox; d[ptr+1]=s.y; d[ptr+2]=s.oz; d[ptr+3]=nx*inv; d[ptr+4]=1*inv; d[ptr+5]=nz*inv; d[ptr+6]=0.02; d[ptr+7]=0.34+Math.max(0,s.y)*0.08; d[ptr+8]=0.48+Math.max(0,s.y)*0.10; ptr+=9;} gl.bindBuffer(gl.ARRAY_BUFFER,ocean.vb); gl.bufferSubData(gl.ARRAY_BUFFER,0,d); }
 function drawMesh(mesh,model,vp,isWater,indexed){const mvp=m4mul(vp,model); gl.uniformMatrix4fv(loc.mvp,false,mvp); gl.uniformMatrix4fv(loc.model,false,model); gl.uniform1f(loc.water,isWater?1:0); bindMesh(mesh,indexed); if(indexed) gl.drawElements(gl.TRIANGLES,mesh.count,gl.UNSIGNED_SHORT,0); else gl.drawArrays(gl.TRIANGLES,0,mesh.count); }
 function resizeCanvas(){const dpr=Math.min(window.devicePixelRatio||1,2);const w=Math.max(2,Math.floor(canvas.clientWidth*dpr)),h=Math.max(2,Math.floor(canvas.clientHeight*dpr)); if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;} gl.viewport(0,0,w,h); return [w,h]; }
 function render3D(now){ if(!gl||!ready) return; const t=now*0.001; const [w,h]=resizeCanvas(); updateOcean(t); gl.clearColor(0.40,0.69,0.82,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT); const sC=waveSample(boatState.x,boatState.z,t), sB=waveSample(boatState.x+Math.sin(boatState.yaw)*2.2,boatState.z-Math.cos(boatState.yaw)*2.2,t), sS=waveSample(boatState.x-Math.sin(boatState.yaw)*2.0,boatState.z+Math.cos(boatState.yaw)*2.0,t), sP=waveSample(boatState.x-Math.cos(boatState.yaw)*1.1,boatState.z-Math.sin(boatState.yaw)*1.1,t), sT=waveSample(boatState.x+Math.cos(boatState.yaw)*1.1,boatState.z+Math.sin(boatState.yaw)*1.1,t); const pitch=Math.atan2(sB.y-sS.y,4.2)*0.8; const roll=Math.atan2(sT.y-sP.y,2.2)*0.9; const boatY=sC.y+0.45; const camDist=9.8, camHeight=4.9; const eye=[boatState.x-Math.sin(boatState.yaw)*camDist, boatY+camHeight, boatState.z+Math.cos(boatState.yaw)*camDist]; const target=[boatState.x, boatY+1.0, boatState.z-0.3]; const vp=m4mul(m4persp(Math.PI/3,w/h,0.1,140), m4look(eye,target,[0,1,0])); drawMesh(ocean,m4identity(),vp,true,true); let model=m4mul(m4translate(boatState.x,boatY,boatState.z), m4mul(m4rotY(boatState.yaw), m4mul(m4rotZ(roll), m4mul(m4rotX(pitch), m4scale(0.85,0.85,0.85))))); drawMesh(boat,model,vp,false,false); }

 function loop(now){const dt=Math.min(.033,(now-last)/1000); last=now; if(boatScene.classList.contains('active')){ if(held.gas) boatState.speed+=0.23*dt; else boatState.speed-=0.045*dt; if(held.brake) boatState.speed-=0.52*dt; boatState.speed=Math.max(0,Math.min(.33,boatState.speed)); const steer=(0.8+boatState.speed*2.0)*dt; if(held.left) boatState.yaw-=steer; if(held.right) boatState.yaw+=steer; const dx=Math.sin(boatState.yaw), dz=-Math.cos(boatState.yaw); boatState.x+=dx*boatState.speed*12*dt; boatState.z+=dz*boatState.speed*12*dt; boatState.x=Math.max(-18,Math.min(18,boatState.x)); boatState.z=Math.max(-2,Math.min(30,boatState.z)); speedValue.textContent=Math.round(boatState.speed/.33*38); if(boatState.speed<.02){ goalText.textContent='Hier kannst du angeln.'; fishBtn.classList.remove('hidden'); } else { goalText.textContent='Fahr, wohin du möchtest. Zum Angeln anhalten.'; fishBtn.classList.add('hidden'); } render3D(now); }
 if(fishingScene.classList.contains('active')){ const m=Math.hypot(joy.x,joy.y); if(m>.08){ps.x+=joy.x*.17*dt;ps.y+=joy.y*.17*dt;ps.x=Math.max(.34,Math.min(.66,ps.x));ps.y=Math.max(.33,Math.min(.72,ps.y));player.style.left=ps.x*100+'%';player.style.top=ps.y*100+'%';player.style.transform=`translate(-50%,-50%) rotate(${joy.x*6}deg)`;} const rs=.22*dt; if(rodHeld.up)rodState.y-=rs; if(rodHeld.down)rodState.y+=rs; if(rodHeld.left)rodState.x-=rs; if(rodHeld.right)rodState.x+=rs; rodState.x=Math.max(.56,Math.min(.92,rodState.x)); rodState.y=Math.max(.30,Math.min(.82,rodState.y)); bobber.style.left=(rodState.x*100)+'%'; bobber.style.top=(rodState.y*100)+'%'; const anchorX=.58,anchorY=.46,dx=(rodState.x-anchorX)*innerWidth,dy=(rodState.y-anchorY)*innerHeight,len=Math.hypot(dx,dy),ang=Math.atan2(dx,dy)*180/Math.PI; rodLine.style.height=Math.max(30,len)+'px'; rodLine.style.transform=`rotate(${-ang}deg)`; const remain=Math.max(0,Math.ceil((nextFishAt-now)/1000)); fishCountdown.textContent=String(remain); if(now>=nextFishAt){spawnFish(); nextFishAt=now+20000;} for(let i=fishes.length-1;i>=0;i--){const f=fishes[i]; if(Math.hypot(rodState.x-f.x,rodState.y-f.y)<.045){ catchCount++; catchCountEl.textContent=catchCount; catchHud.classList.remove('catchFlash'); void catchHud.offsetWidth; catchHud.classList.add('catchFlash'); f.el.remove(); fishes.splice(i,1); } }} requestAnimationFrame(loop);} requestAnimationFrame(loop);
 window.addEventListener('resize',()=>{if(gl&&ready)render3D(performance.now())});
})();
